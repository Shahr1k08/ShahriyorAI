<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaxriyordan sovg'a 🌹</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#020111,#0b1f3a,#111);
}

body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(white 1px,transparent 1px);
background-size:45px 45px;
animation:stars 80s linear infinite;
opacity:.45;
}

@keyframes stars{
from{transform:translateY(0);}
to{transform:translateY(-600px);}
}

.container{
position:relative;
z-index:2;
text-align:center;
}

button{
padding:18px 40px;
font-size:24px;
border:none;
border-radius:50px;
cursor:pointer;
color:white;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.3);
box-shadow:0 0 30px rgba(255,255,255,.3);
transition:.35s;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 50px hotpink;
}

.ground{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:160px;
height:8px;
background:#222;
border-radius:50%;
display:none;
}

.stem{
position:absolute;
bottom:8px;
left:50%;
transform:translateX(-50%);
width:8px;
height:0;
background:#198c19;
border-radius:10px;
}

.leaf{
position:absolute;
width:36px;
height:18px;
background:#2ecc71;
border-radius:100% 0;
opacity:0;
}

.left{
left:-28px;
bottom:120px;
transform:rotate(-35deg);
}

.right{
left:2px;
bottom:180px;
transform:rotate(145deg);
}

.flower{
position:absolute;
left:50%;
bottom:245px;
transform:translateX(-50%) scale(.1);
font-size:90px;
opacity:0;
filter:drop-shadow(0 0 15px crimson);
}

.message{
position:absolute;
top:-120px;
left:50%;
transform:translateX(-50%);
font-size:32px;
color:white;
opacity:0;
text-shadow:0 0 20px hotpink;
}

.heart{
position:absolute;
color:#ff4d6d;
font-size:20px;
animation:fly 5s linear forwards;
}

@keyframes growStem{
to{
height:240px;
}
}

@keyframes bloom{
0%{
opacity:0;
transform:translateX(-50%) scale(.2) rotate(-30deg);
}
100%{
opacity:1;
transform:translateX(-50%) scale(1) rotate(0);
}
}

@keyframes leaf{
to{
opacity:1;
}
}

@keyframes showText{
to{
opacity:1;
top:-170px;
}
}

@keyframes fly{
0%{
transform:translateY(0) scale(.5);
opacity:1;
}
100%{
transform:translateY(-500px) translateX(var(--x));
opacity:0;
}
}
</style>

</head>
<body>

<div class="container">

<button id="gift">
🎁 Shaxriyordan sovg'a
</button>

<div class="ground" id="ground">

<div class="stem" id="stem"></div>

<div class="leaf left" id="leaf1"></div>

<div class="leaf right" id="leaf2"></div>

<div class="flower" id="flower">🌹</div>

<div class="message" id="msg">
Siz uchun ❤️
</div>

</div>

</div>

<script>

const btn=document.getElementById("gift");
const ground=document.getElementById("ground");
const stem=document.getElementById("stem");
const flower=document.getElementById("flower");
const leaf1=document.getElementById("leaf1");
const leaf2=document.getElementById("leaf2");
const msg=document.getElementById("msg");

btn.onclick=function(){

btn.style.display="none";

ground.style.display="block";

stem.style.animation="growStem 3s forwards";

setTimeout(()=>{
leaf1.style.animation="leaf 1s forwards";
},1200);

setTimeout(()=>{
leaf2.style.animation="leaf 1s forwards";
},1700);

setTimeout(()=>{
flower.style.animation="bloom 1.6s forwards";
},2500);

setTimeout(()=>{
msg.style.animation="showText 2s forwards";
},4200);

setInterval(createHeart,220);

}

function createHeart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML=["❤","💖","💕","💗"][Math.floor(Math.random()*4)];

h.style.left=(window.innerWidth/2+(Math.random()*180-90))+"px";

h.style.bottom="220px";

h.style.setProperty("--x",(Math.random()*300-150)+"px");

h.style.fontSize=(18+Math.random()*20)+"px";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},5000);

}

</script>

</body>
</html>
