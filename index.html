<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You - Zulfiya</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Yulduzli fon uchun canvas */
        canvas#bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Asosiy konteyner */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* Konvert / Kartochka dizayni */
        .card {
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid #e056fd;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(224, 86, 253, 0.5);
            backdrop-filter: blur(8px);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            color: #ff7675;
            text-shadow: 0 0 10px rgba(255, 118, 117, 0.5);
        }

        .heart {
            font-size: 3.5rem;
            color: #ff7675;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 10px rgba(255, 118, 117, 0.4); }
            100% { transform: scale(1.25); text-shadow: 0 0 25px rgba(255, 118, 117, 0.9); }
        }

        /* Tugma dizayni */
        button {
            background: linear-gradient(45deg, #ff7675, #e056fd);
            border: none;
            color: white;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(224, 86, 253, 0.4);
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255, 118, 117, 0.8);
        }

        /* Zulfiya ismi chiqadigan qism (Animatsiyasi bilan) */
        #display-text {
            display: none;
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff7675, #e056fd, #74b9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(224, 86, 253, 0.6);
            letter-spacing: 4px;
        }

        /* Silliq paydo bo'lish effekti */
        @keyframes bloomAnimation {
            0% {
                opacity: 0;
                transform: scale(0.3);
                filter: blur(15px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }
    </style>
</head>
<body>

    <!-- Fon yulduzlari uchun -->
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <!-- Boshlang'ich konvert/kartochka -->
        <div class="card" id="card-box">
            <div class="heart">❤️</div>
            <h1>FOR YOU</h1>
            <button onclick="startAnimation()">Ko'rish uchun bosing</button>
        </div>

        <!-- Tugma bosilganda chiqadigan ism -->
        <div id="display-text">Zulfiya</div>
    </div>

    <script>
        // Yulduzli fon yaratish va harakatlantirish
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const stars = [];
        for (let i = 0; i < 180; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.8,
                alpha: Math.random(),
                speed: Math.random() * 0.025 + 0.005
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.
